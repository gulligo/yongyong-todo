<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>용용이 할일</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3a3b40" id="themeColor">
<style>
  :root { --bg: #3a3b40; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: #fff;
    font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    transition: background .3s; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 18px) 26px 10px;
  }
  .icon-btn {
    width: 44px; height: 44px; border: none; background: none; color: rgba(255,255,255,.85);
    font-size: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
  }
  .icon-btn:active { background: rgba(255,255,255,.12); }
  .plus {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.85);
    color: var(--bg); font-size: 26px; font-weight: 700; line-height: 32px; text-align: center;
  }
  .all-btn {
    border: 1.5px solid rgba(255,255,255,.35); background: none; color: rgba(255,255,255,.75);
    border-radius: 20px; padding: 6px 16px; font-size: 14px;
  }
  .all-btn.on { background: rgba(255,255,255,.85); color: var(--bg); border-color: transparent; font-weight: 700; }
  #list { list-style: none; margin: 0; padding: 0 0 120px; height: calc(100% - 80px); overflow-y: auto; }
  .item { position: relative; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,.07); }
  .item .back {
    position: absolute; inset: 0; background: #2ecc71; display: flex; justify-content: space-between;
    align-items: center; padding: 0 28px; font-size: 26px; font-weight: 700; opacity: 0;
  }
  .item .front {
    position: relative; background: var(--bg); padding: 26px 24px; text-align: center;
    font-size: 19px; line-height: 1.4; word-break: break-all; touch-action: pan-y;
  }
  .item.hidden-sched .front { opacity: .45; }
  .tag {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; font-size: 12px;
    vertical-align: middle; background: rgba(255,255,255,.18); font-weight: 700;
  }
  .tag.today { background: #e74c3c; }
  .item.gone { transition: height .25s, opacity .25s; }
  .empty { text-align: center; color: rgba(255,255,255,.4); margin-top: 35vh; font-size: 16px; line-height: 1.8; }

  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; z-index: 10;
  }
  .sheet-bg.show { display: flex; }
  .sheet {
    width: 100%; background: #fff; color: #222; border-radius: 18px 18px 0 0;
    padding: 20px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 88vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 14px; font-size: 17px; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; min-width: 0; font-size: 17px; padding: 12px 14px; border: 1.5px solid #ccc; border-radius: 10px; outline: none;
  }
  .row input:focus { border-color: #7b5cff; }
  .btn { border: none; border-radius: 10px; padding: 0 18px; font-size: 16px; font-weight: 700; background: #7b5cff; color: #fff; }
  .btn.gray { background: #e5e5ea; color: #333; }

  .colors { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .color { width: 46px; height: 46px; border-radius: 50%; border: 3px solid transparent; }
  .color.on { border-color: #222; }

  /* 달력 */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-head b { font-size: 17px; }
  .cal-head button { border: none; background: #f0f0f3; border-radius: 8px; width: 38px; height: 34px; font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; margin-bottom: 12px; }
  .cal .w { font-size: 12px; color: #999; padding: 4px 0; }
  .cal .w:first-child { color: #e74c3c; }
  .cal .d { position: relative; padding: 9px 0 13px; border-radius: 10px; font-size: 15px; }
  .cal .d.sun { color: #e74c3c; }
  .cal .d.today { font-weight: 800; color: #7b5cff; }
  .cal .d.sel { background: #7b5cff; color: #fff; }
  .cal .d.has::after {
    content: ''; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px;
    border-radius: 50%; background: #e67e22;
  }
  .cal .d.sel.has::after { background: #fff; }
  .day-box { background: #f7f7fa; border-radius: 12px; padding: 12px; margin-bottom: 22px; }
  .day-box .t { font-size: 14px; color: #666; margin-bottom: 8px; }
  .day-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .day-list li { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid #e8e8ee; font-size: 15px; }
  .day-list li span { flex: 1; word-break: break-all; }
  .day-list li button { border: none; background: #fdecea; color: #e74c3c; border-radius: 8px; padding: 6px 10px; font-weight: 700; }
  .day-list li .tm { flex: none; color: #7b5cff; font-weight: 700; font-size: 14px; }
  .day-list li a { background: #e8f0fe; color: #1a73e8; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .day-box .row input { font-size: 15px; padding: 10px 12px; }
  .day-box .btn { font-size: 14px; padding: 0 14px; }

  .opts { display: flex; gap: 8px; margin-bottom: 14px; }
  .opts button { flex: 1; height: 42px; border: 1.5px solid #ddd; background: #fff; border-radius: 10px; font-size: 15px; color: #333; }
  .opts button.on { background: #7b5cff; border-color: #7b5cff; color: #fff; font-weight: 700; }
  .switch-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; font-size: 16px; }
  .switch { width: 52px; height: 30px; border-radius: 15px; background: #ccc; position: relative; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.on { background: #7b5cff; }
  .switch.on::after { left: 25px; }
  .trash-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; }
  .trash-head h3 { margin: 0; }
  .trash-head .btn { height: 34px; font-size: 14px; background: #e74c3c; }
  .trash-list { list-style: none; margin: 0 0 10px; padding: 0; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
  .trash-list li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 15px; }
  .trash-list li:last-child { border-bottom: none; }
  .trash-list .t { flex: 1; color: #555; text-decoration: line-through; word-break: break-all; }
  .trash-list .d { font-size: 12px; color: #999; white-space: nowrap; }
  .trash-list button { border: none; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 700; }
  .trash-list .r { background: #e8f8ef; color: #1e9e57; }
  .trash-list .x { background: #fdecea; color: #e74c3c; }
  .trash-empty { color: #aaa; text-align: center; padding: 16px; font-size: 14px; }
  .close-row { margin-top: 18px; display: flex; }
  .close-row .btn { flex: 1; height: 46px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translate(-50%, 140px);
    background: #222; color: #fff; padding: 12px 14px 12px 20px; border-radius: 30px; display: flex; gap: 14px;
    align-items: center; font-size: 15px; transition: transform .25s; z-index: 5; max-width: 90%;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
  #toast button { background: #2ecc71; color: #fff; border: none; border-radius: 20px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
  <div class="top">
    <button class="icon-btn" id="setBtn" aria-label="설정">⚙</button>
    <button class="all-btn" id="allBtn">전체보기</button>
    <button class="icon-btn" id="addBtn" aria-label="추가"><div class="plus">+</div></button>
  </div>

  <ul id="list"></ul>

  <!-- 추가/수정 -->
  <div class="sheet-bg" id="editBg">
    <div class="sheet">
      <h3 id="editTitle">할 일 추가</h3>
      <div class="row">
        <input id="editInput" placeholder="할 일을 적어주세요" enterkeyhint="done">
        <button class="btn" id="saveBtn">확인</button>
      </div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="sheet-bg" id="setBg">
    <div class="sheet">
      <h3>📅 예약</h3>
      <div class="cal-head">
        <button id="prevM">‹</button><b id="calTitle"></b><button id="nextM">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="day-box">
        <div class="t" id="dayTitle"></div>
        <ul class="day-list" id="dayList"></ul>
        <div class="row">
          <input id="schedInput" placeholder="이 날 할 일" enterkeyhint="done">
        </div>
        <div class="row" style="margin-top:8px">
          <input id="schedTime" type="time">
          <button class="btn" id="schedAdd">예약</button>
        </div>
      </div>

      <h3>🔔 지울 때 소리</h3>
      <div class="opts" id="soundOpts"></div>
      <div class="switch-row"><span>진동</span><div class="switch" id="vibeSw"></div></div>

      <h3>배경색</h3>
      <div class="colors" id="colors"></div>

      <div class="trash-head">
        <h3>🗑 휴지통 <span id="trashCount" style="color:#999;font-size:14px"></span></h3>
        <button class="btn" id="emptyTrash">전체 버리기</button>
      </div>
      <ul class="trash-list" id="trashList"></ul>

      <div class="close-row"><button class="btn gray" id="setClose">닫기</button></div>
    </div>
  </div>

  <div id="toast"><span id="toastText"></span><button id="undoBtn">되돌리기</button></div>

<script>
const KEY = 'yongyong-todo';
const COLORS = ['#3a3b40', '#4f6670', '#c08356', '#b2585e', '#7a63a8', '#4a63b5'];
const SHOW_BEFORE = 2; // 예약일 이틀 전부터 홈에 보임

let data = { items: [], sched: [], trash: [], color: COLORS[0], sound: 'ding', vibe: true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) data = Object.assign(data, s); } catch (e) {}
['items', 'sched', 'trash'].forEach(k => { if (!Array.isArray(data[k])) data[k] = []; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

const $ = id => document.getElementById(id);
const list = $('list');
const newId = () => Date.now() + '' + Math.random().toString(36).slice(2, 6);
let editRef = null, lastDeleted = null, toastTimer = null, showAll = false;

// 날짜 도우미
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
function daysLeft(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
}
const md = s => { const [, m, d] = s.split('-').map(Number); return m + '/' + d; };

function applyColor() {
  document.documentElement.style.setProperty('--bg', data.color);
  $('themeColor').setAttribute('content', data.color);
}

// 홈 목록
function render() {
  list.innerHTML = '';
  const rows = data.items.map(it => ({ it, kind: 'items' }));
  data.sched
    .slice().sort((a, b) => a.date.localeCompare(b.date))
    .forEach(it => {
      const left = daysLeft(it.date);
      if (left <= SHOW_BEFORE || showAll) rows.push({ it, kind: 'sched', left, hidden: left > SHOW_BEFORE });
    });

  if (!rows.length) {
    list.innerHTML = '<div class="empty">할 일이 없습니다 🎉<br>+ 를 눌러 추가하세요</div>';
    return;
  }
  rows.forEach(r => {
    const li = document.createElement('li');
    li.className = 'item' + (r.hidden ? ' hidden-sched' : '');
    li.innerHTML = '<div class="back"><span>✓</span><span>✓</span></div><div class="front"></div>';
    const front = li.querySelector('.front');
    front.textContent = r.it.text;
    if (r.kind === 'sched') {
      const tag = document.createElement('span');
      tag.className = 'tag' + (r.left <= 0 ? ' today' : '');
      tag.textContent = (r.left < 0 ? md(r.it.date) + ' 지남' : r.left === 0 ? '오늘' : r.hidden ? md(r.it.date) : 'D-' + r.left)
        + (r.it.time ? ' ' + r.it.time : '');
      front.appendChild(tag);
    }
    bindSwipe(li, r);
    list.appendChild(li);
  });
}

function bindSwipe(li, r) {
  const front = li.querySelector('.front'), back = li.querySelector('.back');
  let sx = 0, sy = 0, dx = 0, mode = null, id = null;

  front.addEventListener('pointerdown', e => {
    id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; mode = null;
    front.style.transition = 'none';
  });
  front.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!mode) {
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { mode = 'swipe'; front.setPointerCapture(id); }
      else if (Math.abs(my) > 10) { mode = 'scroll'; }
    }
    if (mode === 'swipe') {
      dx = mx;
      front.style.transform = `translateX(${dx}px)`;
      back.style.opacity = Math.min(Math.abs(dx) / (li.offsetWidth * 0.35), 1);
    }
  });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null;
    if (mode === 'swipe') {
      front.style.transition = 'transform .2s';
      if (Math.abs(dx) > li.offsetWidth * 0.35) {
        doneFeedback();
        front.style.transform = `translateX(${dx > 0 ? '110%' : '-110%'})`;
        setTimeout(() => removeItem(li, r), 200);
      } else {
        front.style.transform = 'translateX(0)';
        back.style.opacity = 0;
      }
    } else if (!mode && e.type === 'pointerup') {
      openEdit(r);  // 짧게 누르면 수정
    }
    mode = null;
  };
  front.addEventListener('pointerup', end);
  front.addEventListener('pointercancel', end);
}

function removeItem(li, r) {
  li.style.height = li.offsetHeight + 'px';
  li.classList.add('gone');
  requestAnimationFrame(() => { li.style.height = '0px'; li.style.opacity = 0; });
  setTimeout(() => {
    const arr = data[r.kind];
    const idx = arr.findIndex(x => x.id === r.it.id);
    if (idx < 0) return;
    lastDeleted = { item: arr[idx], kind: r.kind, idx };
    arr.splice(idx, 1);
    data.trash.unshift(Object.assign({}, r.it, { deletedAt: Date.now() }));
    save(); render(); showToast(r.it.text);
  }, 250);
}

function showToast(text) {
  $('toastText').textContent = '✓ ' + text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').classList.remove('show'); lastDeleted = null; }, 4000);
}
$('undoBtn').onclick = () => {
  if (!lastDeleted) return;
  data[lastDeleted.kind].splice(lastDeleted.idx, 0, lastDeleted.item);
  data.trash = data.trash.filter(x => x.id !== lastDeleted.item.id);
  lastDeleted = null; save(); render();
  $('toast').classList.remove('show');
};

// 전체보기
$('allBtn').onclick = () => {
  showAll = !showAll;
  $('allBtn').classList.toggle('on', showAll);
  render();
};

// 추가 / 수정
function openEdit(r) {
  editRef = r;
  $('editTitle').textContent = r ? '할 일 수정' : '할 일 추가';
  $('editInput').value = r ? r.it.text : '';
  $('editBg').classList.add('show');
  setTimeout(() => $('editInput').focus(), 50);
}
function saveEdit() {
  const text = $('editInput').value.trim();
  if (text) {
    if (editRef) {
      const it = data[editRef.kind].find(x => x.id === editRef.it.id);
      if (it) it.text = text;
    } else data.items.push({ id: newId(), text });
    save(); render();
  }
  $('editInput').blur();
  $('editBg').classList.remove('show');
}
$('addBtn').onclick = () => openEdit(null);
$('saveBtn').onclick = saveEdit;
$('editInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(); });
$('editBg').addEventListener('click', e => { if (e.target.id === 'editBg') $('editBg').classList.remove('show'); });

// 달력
let calY, calM, selDate;
function renderCal() {
  $('calTitle').textContent = calY + '년 ' + (calM + 1) + '월';
  const cal = $('cal');
  cal.innerHTML = '';
  '일월화수목금토'.split('').forEach(w => {
    const d = document.createElement('div'); d.className = 'w'; d.textContent = w; cal.appendChild(d);
  });
  const first = new Date(calY, calM, 1).getDay();
  const last = new Date(calY, calM + 1, 0).getDate();
  const has = new Set(data.sched.map(s => s.date));
  const today = todayStr();
  for (let i = 0; i < first; i++) cal.appendChild(document.createElement('div'));
  for (let day = 1; day <= last; day++) {
    const ds = calY + '-' + pad(calM + 1) + '-' + pad(day);
    const d = document.createElement('div');
    d.className = 'd' + ((first + day - 1) % 7 === 0 ? ' sun' : '') + (ds === today ? ' today' : '') +
      (ds === selDate ? ' sel' : '') + (has.has(ds) ? ' has' : '');
    d.textContent = day;
    d.onclick = () => { selDate = ds; renderCal(); };
    cal.appendChild(d);
  }
  renderDay();
}
function renderDay() {
  const [y, m, d] = selDate.split('-').map(Number);
  const w = '일월화수목금토'[new Date(y, m - 1, d).getDay()];
  $('dayTitle').textContent = m + '월 ' + d + '일 (' + w + ') 예약';
  const ul = $('dayList');
  ul.innerHTML = '';
  data.sched.filter(s => s.date === selDate)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
    .forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = (s.time ? '<span class="tm"></span>' : '') +
      '<span class="tx"></span><a target="_blank" rel="noopener">📅 캘린더</a><button>삭제</button>';
    if (s.time) li.querySelector('.tm').textContent = s.time;
    li.querySelector('.tx').textContent = s.text;
    li.querySelector('a').href = gcalUrl(s);
    li.querySelector('button').onclick = () => {
      data.sched = data.sched.filter(x => x.id !== s.id);
      save(); render(); renderCal();
    };
    ul.appendChild(li);
  });
}
// 구글 캘린더 일정 추가 주소 (시간 있으면 1시간짜리, 없으면 하루 종일)
function gcalUrl(s) {
  const [y, m, d] = s.date.split('-').map(Number);
  let dates;
  if (s.time) {
    const [hh, mm] = s.time.split(':').map(Number);
    const st = new Date(y, m - 1, d, hh, mm), en = new Date(st.getTime() + 3600000);
    const f = t => t.getFullYear() + pad(t.getMonth() + 1) + pad(t.getDate()) + 'T' + pad(t.getHours()) + pad(t.getMinutes()) + '00';
    dates = f(st) + '/' + f(en);
  } else {
    const nx = new Date(y, m - 1, d + 1);
    dates = y + pad(m) + pad(d) + '/' + nx.getFullYear() + pad(nx.getMonth() + 1) + pad(nx.getDate());
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(s.text)
    + '&dates=' + dates
    + '&ctz=Asia/Seoul'
    + '&details=' + encodeURIComponent('용용이 할일 예약');
}
function addSched() {
  const text = $('schedInput').value.trim();
  if (!text) return;
  const time = $('schedTime').value;  // 비워두면 날짜만
  data.sched.push(time ? { id: newId(), text, date: selDate, time } : { id: newId(), text, date: selDate });
  $('schedInput').value = '';
  $('schedTime').value = '';
  $('schedInput').blur();
  save(); render(); renderCal();
}
$('schedAdd').onclick = addSched;
$('schedInput').addEventListener('keydown', e => { if (e.key === 'Enter') addSched(); });
$('prevM').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$('nextM').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };

// 소리 · 진동
let actx = null;
function ctx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(ac, freq, start, dur, vol, type, freqEnd) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, start);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, start + dur * 0.6);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g).connect(ac.destination);
  o.start(start); o.stop(start + dur + 0.02);
}
const SOUNDS = {
  ding(ac, t) {            // 띵동
    tone(ac, 1318.5, t, 0.35, 0.35);
    tone(ac, 1046.5, t + 0.18, 0.5, 0.35);
  },
  pop(ac, t) {             // 뾱
    tone(ac, 420, t, 0.12, 0.5, 'sine', 1300);
  },
  check(ac, t) {           // 착
    const len = Math.floor(ac.sampleRate * 0.06);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = 0.9;
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t);
    tone(ac, 2200, t, 0.05, 0.15, 'square');
  }
};
function playSound(name) {
  if (!name || name === 'off' || !SOUNDS[name]) return;
  const ac = ctx(); if (!ac) return;
  SOUNDS[name](ac, ac.currentTime + 0.01);
}
function doneFeedback() {
  playSound(data.sound);
  if (data.vibe && navigator.vibrate) navigator.vibrate(30);
}
function renderSound() {
  const box = $('soundOpts');
  box.innerHTML = '';
  [['off', '끄기'], ['ding', '띵동'], ['pop', '뾱'], ['check', '착']].forEach(([k, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (data.sound === k) b.className = 'on';
    b.onclick = () => { data.sound = k; save(); renderSound(); playSound(k); };
    box.appendChild(b);
  });
  $('vibeSw').classList.toggle('on', !!data.vibe);
}
$('vibeSw').onclick = () => {
  data.vibe = !data.vibe; save(); renderSound();
  if (data.vibe && navigator.vibrate) navigator.vibrate(30);
};

// 배경색
function renderColors() {
  $('colors').innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color' + (c === data.color ? ' on' : '');
    d.style.background = c;
    d.onclick = () => { data.color = c; save(); applyColor(); renderColors(); };
    $('colors').appendChild(d);
  });
}

// 휴지통
function fmtDate(t) { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); }
function renderTrash() {
  const ul = $('trashList');
  ul.innerHTML = '';
  $('trashCount').textContent = data.trash.length ? data.trash.length + '개' : '';
  $('emptyTrash').style.display = data.trash.length ? '' : 'none';
  if (!data.trash.length) { ul.innerHTML = '<div class="trash-empty">비어 있습니다</div>'; return; }
  data.trash.forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="t"></span><span class="d"></span><button class="r">복원</button><button class="x">버리기</button>';
    li.querySelector('.t').textContent = it.text;
    li.querySelector('.d').textContent = fmtDate(it.deletedAt);
    li.querySelector('.r').onclick = () => {
      data.trash = data.trash.filter(x => x.id !== it.id);
      const { deletedAt, ...item } = it;
      (item.date ? data.sched : data.items).push(item);
      save(); render(); renderTrash(); renderCal();
    };
    li.querySelector('.x').onclick = () => {
      data.trash = data.trash.filter(x => x.id !== it.id);  // 완전 삭제
      save(); renderTrash();
    };
    ul.appendChild(li);
  });
}
$('emptyTrash').onclick = () => {
  if (!confirm('휴지통의 ' + data.trash.length + '개를 완전히 삭제할까요?')) return;
  data.trash = []; save(); renderTrash();
};

$('setBtn').onclick = () => {
  const t = new Date();
  calY = t.getFullYear(); calM = t.getMonth(); selDate = todayStr();
  renderCal(); renderSound(); renderColors(); renderTrash();
  $('setBg').classList.add('show');
};
$('setClose').onclick = () => $('setBg').classList.remove('show');
$('setBg').addEventListener('click', e => { if (e.target.id === 'setBg') $('setBg').classList.remove('show'); });

// 날짜가 바뀌면 다시 그림 (앱을 켜둔 채 자정이 지나도 D-2 반영)
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

applyColor(); render();
</script>
